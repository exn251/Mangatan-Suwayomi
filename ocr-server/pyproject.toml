[project]
name = "ocr-server"
version = "0.2.0"
description = "Server for performing OCR on images"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    # Server & Networking
    "aiohttp>=3.12.15",
    "curl-cffi>=0.14.0",
    "flask[async]>=3.1.1",
    "waitress>=3.0.2",

    # Image, Math & Geometry
    "numpy>=1.26.0",
    "opencv-python-headless>=4.12.0.88",
    "pillow>=10.0.0",
    "pyclipper>=1.4.0",
    "shapely>=2.1.2",
	"loguru>=0.7.0",
	"requests>=2.31.0",

    # ML Inference, Tokenization & Protocols
    "huggingface-hub>=0.28.0",
    "onnxruntime-directml>=1.23.0",
    "optimum[onnxruntime]>=2.1.0",
    "protobuf>=4.25.0",
    "torch>=2.6.0",
    "transformers>=4.40.0",
	"manga-ocr>=0.1.14",
]

[dependency-groups]
dev = [
    "nuitka>=2.7.12",
    "pytest>=8.4.1",
]

[tool.uv]
override-dependencies = [
    "onnxruntime; sys_platform == 'never'",
]
